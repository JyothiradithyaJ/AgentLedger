services:
  - type: web
    name: agentledger
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: DISPUTE_MODE
        value: simulated
      - key: DATABASE_PATH
        value: data/agentledger.db
      - key: KEYS_DIR
        value: data/keys
